    - uuid: ba2905e016b14d6aa9150b3907cfb665
      name: 'Motor: nível de combustível'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.4.1.41385.1.3.1.1.4.{$DSE.INSTANCE}
      key: dse.fuel.level
      delay: 1m
      history: 90d
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: IN_RANGE
        parameters:
        - '0'
        - '2147483639'
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - 'var v = (value - {$DSE.FUEL.EMPTY}) * 100 / ({$DSE.FUEL.FULL} - {$DSE.FUEL.EMPTY});

          return Math.min(Math.max(v, 0), 100);'
      tags:
      - tag: component
        value: motor
      description: 'Nível real do tanque: (leitura do controlador − {$DSE.FUEL.EMPTY}) × 100 / ({$DSE.FUEL.FULL} − {$DSE.FUEL.EMPTY}), limitado a 0–100 %.'
    - uuid: 64c492878da342d098641186cec870ac
      name: 'Motor: tensão da bateria de partida'
