        expression: max(/DSE892 Gerador Stemac by SNMP/dse.battery.volt,3m)=0
        name: 'Gerador: DSE892 sem leitura do controlador'
        priority: HIGH
        description: 'Bateria lida como 0: o DSE892 perdeu o DSE7320 (RS485) e devolve NULL, que o Zabbix grava como 0. Demais triggers do controlador ficam suspensas.'
    - uuid: 974e1c06306747b1afda33eb581b4086
      name: 'Motor: rotação'
