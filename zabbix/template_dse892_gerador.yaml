  triggers:
  - uuid: 9b2b96feca4f4ff4bc1ffdd1423c6ee4
    expression: min(/DSE892 Gerador Stemac by SNMP/dse.engine.coolant.temp,3m)>{$DSE.COOLANT.MAX} and last(/DSE892 Gerador Stemac by SNMP/dse.battery.volt)>0
    name: 'Gerador: temperatura do motor alta (> {$DSE.COOLANT.MAX} °C)'
    priority: DISASTER
  - uuid: 908b34dffd004309937a9648e2d73a82
    expression: last(/DSE892 Gerador Stemac by SNMP/dse.fuel.level)<{$DSE.FUEL.CRIT} and last(/DSE892 Gerador Stemac by SNMP/dse.battery.volt)>0
    name: 'Gerador: combustível crítico (< {$DSE.FUEL.CRIT}%)'
    priority: DISASTER
  - uuid: fed72652e33e44e2803160b283d93f04
    expression: avg(/DSE892 Gerador Stemac by SNMP/dse.fuel.level,15m)<{$DSE.FUEL.LOW} and last(/DSE892 Gerador Stemac by SNMP/dse.battery.volt)>0
    name: 'Gerador: combustível baixo (< {$DSE.FUEL.LOW}%)'
    priority: HIGH
  - uuid: 67795aa650634eeebbfe0c984b9886cc
    expression: max(/DSE892 Gerador Stemac by SNMP/dse.battery.volt,10m)<{$DSE.BATT.MIN} and last(/DSE892 Gerador Stemac by SNMP/dse.battery.volt)>0
    name: 'Gerador: bateria de partida baixa (< {$DSE.BATT.MIN} V)'
    priority: HIGH
  - uuid: df53b2da2e8e486a91160b475463fddd
    expression: (max(/DSE892 Gerador Stemac by SNMP/dse.mains.volt[L1-N],2m)<{$DSE.MAINS.VMIN} or max(/DSE892 Gerador Stemac by SNMP/dse.mains.volt[L2-N],2m)<{$DSE.MAINS.VMIN} or max(/DSE892 Gerador Stemac
      by SNMP/dse.mains.volt[L3-N],2m)<{$DSE.MAINS.VMIN}) and last(/DSE892 Gerador Stemac by SNMP/dse.battery.volt)>0
    name: 'Gerador: falta de rede (tensão de entrada < {$DSE.MAINS.VMIN} V)'
    priority: HIGH
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: min(/DSE892 Gerador Stemac by SNMP/dse.mains.volt[L1-N],5m)>={$DSE.MAINS.VMIN} and min(/DSE892 Gerador Stemac by SNMP/dse.mains.volt[L2-N],5m)>={$DSE.MAINS.VMIN} and min(/DSE892
      Gerador Stemac by SNMP/dse.mains.volt[L3-N],5m)>={$DSE.MAINS.VMIN}
    description: Alguma fase da rede abaixo do mínimo por 2 min.
  - uuid: 123b51facf1f4a17ae51e273410cb4b9
    expression: find(/DSE892 Gerador Stemac by SNMP/dse.trap.description,10m,"iregexp","shutdown|electrical trip|parada|desligamento")=1
    name: 'Gerador: parada por alarme (trap): {ITEM.LASTVALUE1}'
    priority: DISASTER
    description: O DSE7320 reportou shutdown/electrical trip por trap. Fechar manualmente após verificar.
    manual_close: 'YES'
  - uuid: 9b85ea1e51e544118ca84f637fa8bf33
    expression: min(/DSE892 Gerador Stemac by SNMP/dse.engine.rpm,2m)>0 and max(/DSE892 Gerador Stemac by SNMP/dse.gen.current[L1],2m)>{$DSE.GEN.LOAD.AMIN}
    name: 'Gerador: assumiu a carga (gerando com rede em falta)'
    priority: HIGH
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: max(/DSE892 Gerador Stemac by SNMP/dse.engine.rpm,5m)=0
