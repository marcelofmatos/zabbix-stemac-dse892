      triggers:
      - uuid: eb4cc60c45d8437ebba7d7814153c8e1
        expression: last(/DSE892 Gerador Stemac by SNMP/dse.gw.uptime)<600
        name: Gateway DSE892 reiniciou
        priority: INFO
      - uuid: 71449e1accd142e092b0426f98c901bc
        expression: nodata(/DSE892 Gerador Stemac by SNMP/dse.gw.uptime,10m)=1
        name: Gateway DSE892 sem resposta SNMP há 10 min
        priority: HIGH
    - uuid: 926be80a7d0a4d8d9e0bc2529a89ebdf
      name: 'Trap: evento DSE (dseEventTrap)'
      type: SNMP_TRAP
      key: snmptrap["41385\.1\.1\.2"]
      value_type: LOG
      history: 90d
      description: Trap dseEventTrap (.1.3.6.1.4.1.41385.1.1.2.1) com a eventEntry nos varbinds.
      tags:
      - tag: component
        value: trap
    - uuid: fc7baf16162c41ed97937f2511f67291
      name: 'Trap: descrição do evento'
      type: DEPENDENT
      key: dse.trap.description
      delay: '0'
      history: 90d
      value_type: CHAR
      preprocessing:
      - type: REGEX
        parameters:
        - '41385\.1\.1\.1\.1\.6(?:\.\d+)* = (?:\w+: )?\"?([^\"\n]*)'
        - \1
        error_handler: DISCARD_VALUE
      master_item:
        key: snmptrap["41385\.1\.1\.2"]
      tags:
      - tag: component
        value: trap
