        name: 'Gerador: motor em funcionamento'
        priority: WARNING
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/DSE892 Gerador Stemac by SNMP/dse.engine.rpm,5m)=0
        description: Motor girando. Esperado durante falta de rede ou teste programado.
