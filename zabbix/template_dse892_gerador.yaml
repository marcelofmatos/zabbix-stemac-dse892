        name: 'Gerador: controlador fora do modo automático ({ITEM.LASTVALUE1})'
        priority: HIGH
        description: Fora do modo Auto o gerador não parte sozinho numa falta de rede.
    - uuid: 1b39db4e1ffc4470ac5a8aaa2b2d666b
      name: 'Gateway DSE892: uptime'
      type: SNMP_AGENT
      snmp_oid: .1.3.6.1.2.1.1.3.0
      key: dse.gw.uptime
      delay: 1m
      units: uptime
      value_type: UNSIGNED
      preprocessing:
      - type: MULTIPLIER
